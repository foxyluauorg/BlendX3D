name: Build BlendX3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare BlendX3D
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            HTML_FILE="$(find . -maxdepth 1 -type f -name '*.html' | head -n 1)"
            if [ -z "$HTML_FILE" ]; then
              echo "ERROR: No HTML app file found."
              exit 1
            fi
            cp "$HTML_FILE" www/index.html
          fi

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.blendx3d",
            "appName": "BlendX3D",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build BlendX3D APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload BlendX3D APK
        uses: actions/upload-artifact@v4
        with:
          name: BlendX3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
