name: Build BlendX3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found on the runner."
            exit 1
          fi
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDKMANAGER" --licenses
          "$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare BlendX3D
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets

          mkdir -p www assets
          if [ -f ic_launcher.png ]; then cp ic_launcher.png assets/icon-only.png; fi
          if [ -f splash.png ]; then cp splash.png assets/splash.png; fi

          if [ -f Index.html ]; then
            cp Index.html www/index.html
          elif [ -f index.html ]; then
            cp index.html www/index.html
          else
            HTML_FILE="$(find . -maxdepth 1 -type f -iname '*.html' | head -n 1)"
            if [ -z "$HTML_FILE" ]; then
              echo "ERROR: No HTML app file found."
              exit 1
            fi
            cp "$HTML_FILE" www/index.html
          fi

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.blendx3d",
            "appName": "BlendX3D",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          # Force the native Android activity into landscape on every launch.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace("<activity", '<activity android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY
          # Use an immersive landscape activity so Android's white navigation strip
          # and letterboxed window edges do not remain beside the editor.
          mkdir -p android/app/src/main/java/com/blendx3d
          cat > android/app/src/main/java/com/blendx3d/MainActivity.java <<'JAVA'
          package com.blendx3d;

          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void applyImmersiveMode() {
                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(32, 33, 39));
                  window.setNavigationBarColor(Color.rgb(32, 33, 39));
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      window.setNavigationBarContrastEnforced(false);
                      window.setStatusBarContrastEnforced(false);
                  }
                  // Hide both the top status bar and bottom navigation bar.
                  // Draw the editor edge-to-edge with no system-bar strips.
                  window.getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(Color.rgb(32, 33, 39)));
                  applyImmersiveMode();
              }
              @Override public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersiveMode();
              }
          }
          JAVA
      - name: Build BlendX3D APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload BlendX3D APK
        uses: actions/upload-artifact@v4
        with:
          name: BlendX3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
